services:
  # Full Stack Web Service (Backend Express + React Frontend served on 1 URL)
  - type: web
    name: transitaxi-app
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_PROD_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: MAP_CACHE_TTL_MS
        value: "300000"
      - key: MAP_CACHE_MAX_ENTRIES
        value: "500"
      - key: ALLOW_PUBLIC_MAP_PROVIDERS
        value: "true"
